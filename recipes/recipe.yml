---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ltcsway-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Pre-installed Homebrew with auto-setup on first boot
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/brew:latest /system_files /

  - type: systemd
    system:
      enabled:
        - brew-setup.service
        - brew-update.timer
        - brew-upgrade.timer

  # Nobara COPR — gamescope + falcond
  - type: dnf
    repos:
      files:
        - https://copr.fedorainfracloud.org/coprs/gloriouseggroll/nobara-42/repo/fedora-42/gloriouseggroll-nobara-42.repo
    install:
      install-weak-deps: false
      packages:
        - gamescope
        - falcond
        - falcond-gui

  # CachyOS COPR — scx-scheds for LAVD scheduler
  - type: dnf
    repos:
      files:
        - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-42/bieszczaders-kernel-cachyos-addons.repo
    install:
      install-weak-deps: false
      packages:
        - scx-scheds

  - type: systemd
    system:
      enabled:
        - falcond.service

  - type: script
    scripts:
      - clone-dotfiles.sh
      - addbrewjustimport.sh
      - install-brew-packages.sh
      - setup-falcond.sh

  - type: rpm-ostree
    install:
      - zsh
      - gammastep
      - steam

    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - install:
          - com.stremio.Stremio
          - org.mozilla.firefox
          - com.discordapp.Discord
          - com.transmissionbt.Transmission
          - com.spotify.Client
          - org.freedesktop.Platform.codecs-extra
          - net.davidotek.pupgui2
          - org.chromium.Chromium
          - io.mpv.Mpv

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

