---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ltcsway-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: script
    scripts:
      - clone-dotfiles.sh
      - set-default-shell.sh

  - type: systemd
    system:
      enabled:
        - set-zsh-default.service
        - scx_loader.service

  # scx-scheds: CachyOS COPR for scx_lavd scheduler
  # Steam also here — allow-erasing resolves base image multilib conflicts
  - type: dnf
    repos:
      files:
        - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-44/bieszczaders-kernel-cachyos-addons.repo
    install:
      install-weak-deps: false
      allow-erasing: true
      packages:
        - scx-scheds
        - gamescope
        - steam
        - mangohud

  - type: rpm-ostree
    install:
      - zsh
      - gammastep

    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - install:
          - com.stremio.Stremio
          - org.mozilla.firefox
          - com.discordapp.Discord
          - com.transmissionbt.Transmission
          - com.spotify.Client
          - org.freedesktop.Platform.codecs-extra
          - net.davidotek.pupgui2
          - org.chromium.Chromium
          - io.mpv.Mpv

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

