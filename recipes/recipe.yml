---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: ltcsway-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/wayblueorg/sway
image-version: latest # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Pre-installed Homebrew with auto-setup on first boot
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/ublue-os/brew:latest /system_files /

  # falcond + falcond-gui: COPR fc44 package missing falcond-gui, pull fc43 RPM as workaround
  # falcond and falcond-gui have a circular dependency, so we install both with --nodeps
  - type: containerfile
    snippets:
      - >-
        RUN dnf install -y dnf-plugins-core &&
        dnf copr enable -y gloriouseggroll/nobara-44 &&
        dnf download --destdir=/tmp/falcond-rpms falcond-2.0.14 falcond-profiles &&
        dnf copr disable -y gloriouseggroll/nobara-44 &&
        dnf copr enable -y gloriouseggroll/nobara-43 &&
        dnf download --destdir=/tmp/falcond-rpms falcond-gui &&
        dnf copr disable -y gloriouseggroll/nobara-43 &&
        dnf remove -y dnf-plugins-core &&
        rpm -ivh --nodeps /tmp/falcond-rpms/*.rpm &&
        rm -rf /tmp/falcond-rpms /var/cache/dnf

  - type: systemd
    system:
      enabled:
        - brew-setup.service
        - brew-update.timer
        - brew-upgrade.timer

  # Gaming: Nobara COPR (gamescope) + CachyOS COPR (scx-scheds)
  - type: dnf
    repos:
      files:
        - https://copr.fedorainfracloud.org/coprs/gloriouseggroll/nobara-44/repo/fedora-44/gloriouseggroll-nobara-44.repo
        - https://copr.fedorainfracloud.org/coprs/bieszczaders/kernel-cachyos-addons/repo/fedora-44/bieszczaders-kernel-cachyos-addons.repo
    install:
      install-weak-deps: false
      packages:
        - gamescope
        - scx-scheds

  - type: systemd
    system:
      enabled:
        - falcond.service

  - type: script
    scripts:
      - clone-dotfiles.sh
      - addbrewjustimport.sh
      - install-brew-packages.sh
      - setup-falcond.sh

  - type: rpm-ostree
    install:
      - zsh
      - gammastep
      - steam

    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - install:
          - com.stremio.Stremio
          - org.mozilla.firefox
          - com.discordapp.Discord
          - com.transmissionbt.Transmission
          - com.spotify.Client
          - org.freedesktop.Platform.codecs-extra
          - net.davidotek.pupgui2
          - org.chromium.Chromium
          - io.mpv.Mpv

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

